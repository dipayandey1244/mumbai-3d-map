<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Mumbai 3D | OpenStreetMap</title><link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#0b1520;color:#fff;font-family:system-ui,-apple-system,sans-serif}#map{position:absolute;inset:0}.panel{position:absolute;top:18px;left:18px;z-index:2;background:#101e2de8;padding:18px;border:1px solid #ffffff28;border-radius:16px;max-width:320px;box-shadow:0 12px 30px #0005}.panel h1{font-size:22px;margin:0 0 4px}.panel p{font-size:12px;color:#b8c6d5;margin:0 0 15px}.controls{display:flex;gap:8px;flex-wrap:wrap}button{background:#24394e;color:white;border:1px solid #4a637b;padding:9px 12px;border-radius:8px;cursor:pointer}button:hover{background:#376184}button.active{background:#007e89}.note{font-size:11px;color:#aebdcb;margin-top:12px}.maplibregl-popup-content{background:#152536;color:#fff;border-radius:10px}.maplibregl-popup-close-button{color:#fff;font-size:18px}@media(max-width:550px){.panel{top:10px;left:10px;right:54px;max-width:none;padding:12px}.panel h1{font-size:18px}.controls button{padding:7px 9px;font-size:12px}}</style></head><body><div id="map"></div><div class="panel"><h1>🌆 Mumbai 3D Explorer</h1><p>OpenStreetMap • MapLibre • Interactive city model</p><div class="controls"><button id="south" class="active">South Mumbai</button><button id="bandra">Bandra</button><button id="bkc">BKC</button><button id="reset">Reset view</button><button id="toggle">Hide 3D</button></div><div class="note">Drag to pan • Right-drag / Ctrl-drag to rotate and tilt • Scroll to zoom. Building heights depend on available OSM data.</div></div><script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script><script>
const map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/liberty',center:[72.8277,18.9388],zoom:15.2,pitch:65,bearing:-22,antialias:true});map.addControl(new maplibregl.NavigationControl({visualizePitch:true}),'top-right');map.addControl(new maplibregl.ScaleControl(),'bottom-right');
let buildingsVisible=true;const locations={south:{center:[72.8277,18.9388],zoom:15.2,pitch:65,bearing:-22},bandra:{center:[72.8242,19.055],zoom:15,pitch:65,bearing:-25},bkc:{center:[72.8656,19.066],zoom:15.5,pitch:65,bearing:-20}};
function addBuildings(){const style=map.getStyle();if(!style)return;const sources=style.sources;let sourceId=Object.keys(sources).find(k=>sources[k].type==='vector'&&/openmaptiles|openfreemap|planet/i.test(k));if(!sourceId)sourceId=Object.keys(sources).find(k=>sources[k].type==='vector');if(!sourceId){console.warn('No vector source found');return;}const layers=map.getStyle().layers;const labelLayer=layers.find(l=>l.type==='symbol'&&l.layout&&l.layout['text-field']);try{map.addLayer({id:'mumbai-3d-buildings',type:'fill-extrusion',source:sourceId,'source-layer':'building',minzoom:13,paint:{'fill-extrusion-color':['interpolate',['linear'],['coalesce',['to-number',['get','render_height']],['to-number',['get','height']],12],0,'#9bb5c5',40,'#6c91ac',120,'#466e94',250,'#315377'],'fill-extrusion-height':['coalesce',['to-number',['get','render_height']],['to-number',['get','height']],12],'fill-extrusion-base':['coalesce',['to-number',['get','render_min_height']],['to-number',['get','min_height']],0],'fill-extrusion-opacity':0.85}},labelLayer?.id);}catch(e){console.error('3D layer:',e);}}
map.on('load',()=>{addBuildings();});
function fly(name){map.flyTo({...locations[name],duration:1800,essential:true});document.querySelectorAll('.controls button').forEach(b=>b.classList.remove('active'));document.getElementById(name).classList.add('active')}
for(const n of ['south','bandra','bkc'])document.getElementById(n).onclick=()=>fly(n);document.getElementById('reset').onclick=()=>fly('south');document.getElementById('toggle').onclick=()=>{buildingsVisible=!buildingsVisible;if(map.getLayer('mumbai-3d-buildings'))map.setLayoutProperty('mumbai-3d-buildings','visibility',buildingsVisible?'visible':'none');document.getElementById('toggle').textContent=buildingsVisible?'Hide 3D':'Show 3D'};
const landmarks=[['Gateway of India',[72.8347,18.9220]],['Chhatrapati Shivaji Maharaj Terminus',[72.8355,18.9401]],['Marine Drive',[72.8236,18.9440]],['Bandra–Worli Sea Link',[72.8175,19.0365]],['Bandra Kurla Complex',[72.8656,19.0660]]];landmarks.forEach(([name,coords])=>{new maplibregl.Marker({color:'#00d4c8',scale:.75}).setLngLat(coords).setPopup(new maplibregl.Popup({offset:15}).setText(name)).addTo(map)});
</script><a href="./game.html" style="position:fixed;bottom:20px;left:20px;z-index:20;background:#08a99f;color:#fff;text-decoration:none;font:700 16px system-ui;padding:15px 22px;border-radius:12px;box-shadow:0 8px 24px #0008">🚘 PLAY MUMBAI FREE ROAM</a></body></html>
