<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Mumbai Street Drive — 3D Game</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#8cc9ed;font-family:system-ui,Arial;color:#fff;touch-action:none}canvas{display:block;width:100%;height:100%}
#hud{position:absolute;top:15px;left:15px;padding:16px 19px;background:#071727c9;border:1px solid #ffffff45;border-radius:16px;backdrop-filter:blur(10px);max-width:290px;box-shadow:0 8px 35px #0005}
#hud h1{font-size:18px;letter-spacing:1px;margin:0 0 4px}#hud small{font-size:11px;color:#9bdfed}#speed{font-size:45px;font-weight:900;line-height:1.1;margin-top:10px}#hud .unit{font-size:12px;color:#bdd3e0}#mission{font-size:13px;margin-top:9px}#distance{color:#f8d66d;font-size:12px;margin-top:5px}
#toolbar{position:absolute;top:15px;right:15px;display:flex;gap:8px}button{border:1px solid #ffffff55;background:#09233cdd;color:#fff;border-radius:12px;padding:12px;font-weight:750;cursor:pointer}button:active,.held{background:#128e9e!important}
#controls{position:absolute;bottom:20px;left:18px;right:18px;display:flex;justify-content:space-between;pointer-events:none}#controls>div{display:flex;gap:10px;pointer-events:auto}#controls button{font-size:25px;width:67px;height:67px;user-select:none}
#help{position:absolute;bottom:103px;left:50%;transform:translateX(-50%);background:#091e31bf;border-radius:10px;padding:8px 13px;font-size:12px;white-space:nowrap}#toast{position:absolute;top:25%;left:50%;transform:translateX(-50%);padding:16px 25px;border-radius:13px;background:#0a8d8bdf;font-weight:800;opacity:0;transition:opacity .25s;pointer-events:none;text-align:center}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#071827;color:#fff;font-weight:700;z-index:20}#error{display:none;position:absolute;inset:0;background:#071827;z-index:30;padding:35px;align-items:center;justify-content:center;text-align:center}
@media(max-width:600px){#hud{top:8px;left:8px;padding:11px;max-width:185px}#hud h1{font-size:14px}#speed{font-size:32px}#toolbar{top:8px;right:8px}#toolbar button{padding:9px;font-size:11px}#controls button{width:59px;height:59px}#help{font-size:10px;bottom:91px}}
</style></head><body>
<div id="loading">Loading Mumbai 3D World…</div><div id="error">3D graphics could not load. Please check your internet connection and WebGL support.</div>
<div id="hud"><h1>🏎️ MUMBAI STREET DRIVE</h1><small>3D FREE ROAM • PORSCHE-INSPIRED COUPE</small><div><span id="speed">0</span> <span class="unit">KM/H</span></div><div id="mission">🎯 Reach Gateway of India</div><div id="distance">Follow the glowing waypoint</div><small id="found">Landmarks: 0 / 5</small></div>
<div id="toolbar"><button id="camera">📷 CAMERA</button><button id="reset">↻ RESET</button></div>
<div id="help">WASD / arrows: drive · Space: brake · C: camera</div>
<div id="controls"><div><button data-key="ArrowLeft">◀</button><button data-key="ArrowRight">▶</button></div><div><button data-key="ArrowDown">▼</button><button data-key="ArrowUp">▲</button></div></div><div id="toast"></div>
<script type="module">
import * as THREE from 'https://esm.sh/three@0.160.1';
const $=id=>document.getElementById(id);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9ed5f4);scene.fog=new THREE.FogExp2(0x9ed5f4,.0025);
const camera=new THREE.PerspectiveCamera(68,innerWidth/innerHeight,.1,2500);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.45;document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xc8e8ff,0x68795d,2.1));
const sun=new THREE.DirectionalLight(0xffe6bf,3.0);sun.position.set(-150,260,-120);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-260;sun.shadow.camera.right=260;sun.shadow.camera.top=260;sun.shadow.camera.bottom=-260;sun.shadow.normalBias=.03;scene.add(sun);
const mat=(color,roughness=.85,metalness=0)=>new THREE.MeshStandardMaterial({color,roughness,metalness});
const roadMat=mat(0x303a43),sidewalkMat=mat(0xb8b9ad),grassMat=mat(0x5f9764),lineMat=mat(0xf7e7b7),waterMat=mat(0x317d9b,.25,.12);
function box(w,h,d,m,x,y,z,parent=scene){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=h>2;o.receiveShadow=true;parent.add(o);return o}
function plane(w,d,m,x,y,z){const o=new THREE.Mesh(new THREE.PlaneGeometry(w,d),m);o.rotation.x=-Math.PI/2;o.position.set(x,y,z);o.receiveShadow=true;scene.add(o);return o}
plane(1700,1700,grassMat,0,-.08,0);plane(700,1700,waterMat,-820,-.07,0);
const roadSpacing=115,roadWidth=22,world=7;
for(let i=-world;i<=world;i++){let p=i*roadSpacing;box(roadWidth,.12,1800,roadMat,p,0,0);box(1800,.12,roadWidth,roadMat,0,0,p);
for(let t=-840;t<=840;t+=25){box(.3,.015,9,lineMat,p,.075,t);box(9,.015,.3,lineMat,t,.075,p)}}
const buildingColors=[0xd6b69b,0xc4b7a7,0x9aa8b5,0xe0c9aa,0x9fbbc1,0xd6d1c4,0xaaa6a1];
const windowMat=mat(0x45677d,.18,.35),trimMat=mat(0xece1d0);
let seed=1748;function random(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
const buildings=[];
for(let gx=-7;gx<7;gx++)for(let gz=-7;gz<7;gz++){
const cx=(gx+.5)*roadSpacing,cz=(gz+.5)*roadSpacing;
if(cx < -660)continue;
box(roadSpacing-roadWidth-3,.15,roadSpacing-roadWidth-3,sidewalkMat,cx,.12,cz);
if(random()<.13){for(let k=0;k<6;k++){let px=cx+(random()-.5)*65,pz=cz+(random()-.5)*65;const trunk=box(1.2,8,1.2,mat(0x785b3a),px,4,pz);const crown=new THREE.Mesh(new THREE.IcosahedronGeometry(6+random()*3,1),mat(0x427e43));crown.position.set(px,11,pz);scene.add(crown)}continue}
for(let a=-1;a<=1;a+=2)for(let b=-1;b<=1;b+=2){if(random()<.13)continue;
const x=cx+a*23+(random()-.5)*6,z=cz+b*23+(random()-.5)*6,w=25+random()*11,d=25+random()*11,h=18+Math.pow(random(),1.4)*100;
const color=buildingColors[Math.floor(random()*buildingColors.length)];
box(w,h,d,mat(color),x,h/2+.2,z);buildings.push({x,z,w,d});
if(random()<.8){box(w+1,1,d+1,trimMat,x,h+.5,z);for(let floor=5;floor<h-3;floor+=7){for(let wx=-w/2+4;wx<w/2-1;wx+=6){box(2.5,3.2,.08,windowMat,x+wx,floor,z+d/2+.06);box(2.5,3.2,.08,windowMat,x+wx,floor,z-d/2-.06)}}}
}}
const promenade=box(15,.25,1700,sidewalkMat,-650,.18,0);
for(let z=-780;z<800;z+=38){box(.5,9,.5,mat(0x555c64),-648,4.7,z);const lamp=new THREE.Mesh(new THREE.SphereGeometry(1.3,10,10),new THREE.MeshBasicMaterial({color:0xfff2c0}));lamp.position.set(-648,9.7,z);scene.add(lamp)}
const car=new THREE.Group();scene.add(car);const bodyMat=mat(0xe8edf2,.28,.75),dark=mat(0x17222d,.34,.2),glass=mat(0x1e3b54,.1,.3),red=mat(0xff2540,.25),white=mat(0xfff7d5,.18);
box(2.05,.52,4.65,bodyMat,0,.68,0,car);box(1.85,.42,2.55,bodyMat,0,1.15,.08,car);
box(1.67,.045,.92,glass,0,1.39,-.67,car);box(1.67,.045,.78,glass,0,1.39,.91,car);
box(1.65,.10,.3,bodyMat,0,1.13,2.22,car);box(1.8,.11,.14,dark,0,.5,-2.32,car);box(1.8,.11,.14,dark,0,.5,2.32,car);
for(let s of [-1,1]){box(.38,.12,.11,white,s*.76,.83,-2.34,car);box(.43,.12,.11,red,s*.74,.82,2.34,car)}
const wheels=[];for(let x of [-1,1])for(let z of [-1.52,1.52]){const wheel=new THREE.Mesh(new THREE.CylinderGeometry(.43,.43,.28,20),dark);wheel.rotation.z=Math.PI/2;wheel.position.set(x*1.03,.46,z);wheel.castShadow=true;car.add(wheel);wheels.push(wheel)}
let pos=new THREE.Vector3(0,0,0),heading=0,speed=0,mode=0;const keys=new Set();
const destinations=[{name:'Gateway of India',x:0,z:-350},{name:'CSMT',x:345,z:-230},{name:'Marine Drive',x:-575,z:120},{name:'Colaba Causeway',x:115,z:-580},{name:'Nariman Point',x:-460,z:-465}];let idx=0;const discovered=new Set();
const beacon=new THREE.Group();const beam=new THREE.Mesh(new THREE.CylinderGeometry(3,3,90,24,1,true),new THREE.MeshBasicMaterial({color:0xffd448,transparent:true,opacity:.17,depthWrite:false,side:THREE.DoubleSide}));beam.position.y=45;beacon.add(beam);const ring=new THREE.Mesh(new THREE.TorusGeometry(5,.7,10,32),new THREE.MeshBasicMaterial({color:0xffd448}));ring.rotation.x=Math.PI/2;ring.position.y=1.3;beacon.add(ring);scene.add(beacon);
function checkpoint(){const d=destinations[idx];beacon.position.set(d.x,0,d.z);$('mission').textContent='🎯 Explore '+d.name;$('found').textContent='Landmarks: '+discovered.size+' / '+destinations.length}
checkpoint();
const controls={w:'ArrowUp',a:'ArrowLeft',s:'ArrowDown',d:'ArrowRight'};
addEventListener('keydown',e=>{const k=controls[e.key.toLowerCase()]||e.key;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(k)){e.preventDefault();keys.add(k)}if(e.key.toLowerCase()==='c')mode=(mode+1)%3});
addEventListener('keyup',e=>keys.delete(controls[e.key.toLowerCase()]||e.key));addEventListener('blur',()=>keys.clear());
document.querySelectorAll('[data-key]').forEach(el=>{const k=el.dataset.key;el.addEventListener('pointerdown',e=>{e.preventDefault();keys.add(k);el.classList.add('held');el.setPointerCapture(e.pointerId)});const up=()=>{keys.delete(k);el.classList.remove('held')};el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);el.addEventListener('lostpointercapture',up)});
$('camera').onclick=()=>mode=(mode+1)%3;$('reset').onclick=()=>{pos.set(0,0,0);heading=0;speed=0};
const follow=new THREE.Vector3();const clock=new THREE.Clock();let toastUntil=0;
function update(){const dt=Math.min(clock.getDelta(),.05);const accel=keys.has('ArrowUp')?1:0,back=keys.has('ArrowDown')?1:0;
if(accel)speed+=20*dt;if(back)speed-=29*dt;if(!accel&&!back)speed*=Math.pow(.975,dt*60);if(keys.has(' '))speed*=Math.pow(.8,dt*60);speed=THREE.MathUtils.clamp(speed,-26,115);if(Math.abs(speed)<.15)speed=0;
const steer=(keys.has('ArrowRight')?1:0)-(keys.has('ArrowLeft')?1:0);heading+=steer*dt*(.45+Math.min(Math.abs(speed),80)*.013)*Math.sign(speed||1);
const r=heading;const nx=pos.x+Math.sin(r)*speed/3.6*dt,nz=pos.z-Math.cos(r)*speed/3.6*dt;
const collides=buildings.some(b=>Math.abs(nx-b.x)<b.w/2+1.25&&Math.abs(nz-b.z)<b.d/2+1.6);
if(!collides&&Math.abs(nx)<810&&Math.abs(nz)<810){pos.x=nx;pos.z=nz}else speed*=-.17;
car.position.copy(pos);car.rotation.y=-heading;
for(const w of wheels)w.rotation.x+=speed*dt*.12;
const backDistance=mode===0?12:mode===1?5:42,height=mode===0?5.6:mode===1?2.7:34;
const target=new THREE.Vector3(pos.x-Math.sin(r)*backDistance,height,pos.z+Math.cos(r)*backDistance);
follow.lerp(target,1-Math.exp(-5*dt));camera.position.copy(follow);camera.lookAt(pos.x+Math.sin(r)*12,mode===2?0:1.8,pos.z-Math.cos(r)*12);
const d=destinations[idx],dist=Math.hypot(pos.x-d.x,pos.z-d.z);$('distance').textContent=Math.round(dist)+' m to checkpoint';$('speed').textContent=Math.abs(Math.round(speed));
beacon.rotation.y+=dt*.5;ring.rotation.z+=dt*.6;
if(dist<16){discovered.add(d.name);idx=(idx+1)%destinations.length;checkpoint();$('toast').textContent='✓ '+d.name+' discovered!';$('toast').style.opacity='1';toastUntil=performance.now()+2300}
if(performance.now()>toastUntil)$('toast').style.opacity='0';
renderer.render(scene,camera);requestAnimationFrame(update)}
follow.set(0,6,13);$('loading').remove();update();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.8))});
</script></body></html>
