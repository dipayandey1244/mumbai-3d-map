<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Mumbai Free Roam — 3D Driving</title><link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#06101a;color:white;font-family:system-ui,sans-serif;overflow:hidden;touch-action:none}#map{position:absolute;inset:0}.shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(#0007,transparent 22%,transparent 65%,#0008)}.hud{position:absolute;top:16px;left:16px;background:#081727d9;border:1px solid #ffffff30;padding:14px 18px;border-radius:14px;min-width:235px;box-shadow:0 8px 25px #0007}.hud h1{margin:0;font-size:19px;letter-spacing:1px}.hud small{color:#8be3d5}.speed{font-size:42px;font-weight:900;line-height:1.1;margin-top:12px}.speed span{font-size:13px;font-weight:400;color:#a5bac8}.mission{margin-top:8px;font-size:13px;color:#e4e8ec}.topright{position:absolute;right:16px;top:16px;display:flex;gap:8px}.topright button,.mobile button{background:#0c2235d9;color:#fff;border:1px solid #ffffff60;border-radius:12px;padding:12px;font-weight:800;cursor:pointer}.car{position:absolute;left:50%;top:65%;transform:translate(-50%,-50%);width:47px;height:84px;pointer-events:none;filter:drop-shadow(0 10px 5px #000b)}.car .body{position:absolute;inset:0;border:3px solid #f4f4f4;border-radius:13px 13px 9px 9px;background:linear-gradient(90deg,#98152b 0%,#e43a4c 20%,#c21b32 50%,#e43a4c 80%,#98152b 100%);box-shadow:inset 0 0 0 2px #690c1a}.car .wind{position:absolute;top:15px;left:6px;right:6px;height:21px;background:#193f5b;border-radius:8px 8px 2px 2px;border:2px solid #94c5d5}.car .rear{position:absolute;bottom:10px;left:7px;right:7px;height:14px;background:#1a344c;border-radius:3px}.car .lights{position:absolute;top:1px;left:4px;right:4px;display:flex;justify-content:space-between}.car .lights i{width:10px;height:5px;background:#fff9c5;border-radius:2px}.mobile{position:absolute;bottom:22px;left:18px;right:18px;display:flex;justify-content:space-between;pointer-events:none}.mobile .group{display:flex;gap:10px;pointer-events:auto}.mobile button{width:64px;height:64px;font-size:24px;touch-action:none;user-select:none;background:#0c2235cc}.mobile button:active,.mobile button.held{background:#0a8892}.hint{position:absolute;bottom:96px;left:50%;transform:translateX(-50%);background:#071827bf;padding:8px 12px;border-radius:8px;font-size:12px;white-space:nowrap;color:#d9e9f1}.notice{position:absolute;top:30%;left:50%;transform:translateX(-50%);padding:14px 22px;background:#0b8b84e8;border-radius:12px;font-weight:800;opacity:0;transition:opacity .3s;pointer-events:none;text-align:center}.notice.show{opacity:1}@media(min-width:900px){.mobile{opacity:.35}.mobile:hover{opacity:1}}@media(max-width:600px){.hud{top:10px;left:10px;padding:10px;min-width:170px}.hud h1{font-size:15px}.speed{font-size:30px}.topright{top:10px;right:10px}.topright button{padding:9px;font-size:11px}.hint{font-size:10px;bottom:92px}.mobile button{width:58px;height:58px}}</style></head><body><div id="map"></div><div class="shade"></div><div class="hud"><h1>🚘 MUMBAI FREE ROAM</h1><small>OPENSTREETMAP • 3D DRIVING</small><div class="speed"><span id="speed">0</span> <span>KM/H</span></div><div class="mission" id="mission">🎯 Drive to Gateway of India</div><small id="distance">Finding checkpoint…</small></div><div class="topright"><button id="reset">↻ RESET</button><button id="camera">📷 CAMERA</button><button id="mapbtn">🗺 MAP</button></div><div class="car"><div class="body"></div><div class="wind"></div><div class="rear"></div><div class="lights"><i></i><i></i></div></div><div class="hint">WASD / arrows to drive • Space to brake • Mobile controls below</div><div class="mobile"><div class="group"><button data-key="ArrowLeft">◀</button><button data-key="ArrowRight">▶</button></div><div class="group"><button data-key="ArrowDown">▼</button><button data-key="ArrowUp">▲</button></div></div><div class="notice" id="notice">Checkpoint reached!</div><script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script><script src="https://unpkg.com/three@0.160.1/build/three.min.js"></script><script>
const start=[72.8317,18.9304];const checkpoints=[{name:'Gateway of India',pos:[72.8347,18.9220]},{name:'CSMT Station',pos:[72.8355,18.9401]},{name:'Marine Drive',pos:[72.8236,18.9440]},{name:'Girgaon Chowpatty',pos:[72.8115,18.9554]}];let lng=start[0],lat=start[1],heading=0,speed=0,idx=0,cam=0,playing=true,last=performance.now();const pressed=new Set();try{discovered=new Set(JSON.parse(localStorage.getItem('mumbai-discoveries')||'[]'))}catch(e){}const map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/liberty',center:start,zoom:17,pitch:70,bearing:0,antialias:true,interactive:false});let marker;let threeCar=null,carWheels=[];let scene3d=null;let roadLines=[];let discovered=new Set();function meters(a,b){const dy=(b[1]-a[1])*111320,dx=(b[0]-a[0])*111320*Math.cos(a[1]*Math.PI/180);return Math.hypot(dx,dy)}function destination(){if(marker)marker.remove();const el=document.createElement('div');el.style.cssText='width:25px;height:25px;border:5px solid #ffe15a;border-radius:50%;box-shadow:0 0 15px 7px #ffcb2b88;background:#ffffff55';marker=new maplibregl.Marker({element:el}).setLngLat(checkpoints[idx].pos).addTo(map);document.getElementById('mission').textContent='🎯 Drive to '+checkpoints[idx].name}map.on('load',()=>{const s=map.getStyle(),source=Object.keys(s.sources).find(k=>s.sources[k].type==='vector');if(source){const label=s.layers.find(l=>l.type==='symbol'&&l.layout&&l.layout['text-field']);try{map.addLayer({id:'game-buildings',type:'fill-extrusion',source,'source-layer':'building',minzoom:13,paint:{'fill-extrusion-color':'#7d9eb1','fill-extrusion-height':['coalesce',['to-number',['get','render_height']],['to-number',['get','height']],12],'fill-extrusion-base':['coalesce',['to-number',['get','render_min_height']],0],'fill-extrusion-opacity':.82}},label?.id)}catch(e){console.warn(e)}}destination();try{if(window.THREE){const custom={id:'vehicle-3d',type:'custom',renderingMode:'3d',onAdd(map,gl){this.camera=new THREE.Camera();this.scene=new THREE.Scene();scene3d=this.scene;const light=new THREE.DirectionalLight(0xffffff,1.8);light.position.set(5,8,10);this.scene.add(light);this.scene.add(new THREE.AmbientLight(0xcde6ff,1.1));const body=new THREE.Group();threeCar=body;const mat=(color,metalness=.35)=>new THREE.MeshStandardMaterial({color,metalness,roughness:.32});function block(w,l,h,x,y,z,m){const o=new THREE.Mesh(new THREE.BoxGeometry(w,l,h),m);o.position.set(x,y,z);body.add(o);return o}const paint=mat(0xd91636,.7),glass=mat(0x152d46,.2),black=mat(0x111318),lights=mat(0xfff6cd),rear=mat(0xff172e);block(1.95,4.5,.65,0,0,.7,paint);block(1.7,2.25,.72,0,-.25,1.35,paint);block(1.58,.85,.04,0,-1.0,1.72,glass);block(1.58,.68,.04,0,.8,1.72,glass);for(const x of [-1,1])for(const y of [-1.35,1.35]){const wheel=new THREE.Mesh(new THREE.CylinderGeometry(.42,.42,.25,18),black);wheel.rotation.z=Math.PI/2;wheel.position.set(x*.96,y,.43);body.add(wheel);carWheels.push(wheel)}for(const x of [-.72,.72]){block(.4,.09,.14,x,-2.24,.76,lights);block(.4,.09,.14,x,2.24,.76,rear)}this.scene.add(body);this.renderer=new THREE.WebGLRenderer({canvas:map.getCanvas(),context:gl,antialias:true});this.renderer.autoClear=false},render(gl,matrix){if(!threeCar)return;const mc=maplibregl.MercatorCoordinate.fromLngLat([lng,lat],0);const scale=mc.meterInMercatorCoordinateUnits();const tr=new THREE.Matrix4().makeTranslation(mc.x,mc.y,mc.z).scale(new THREE.Vector3(scale,-scale,scale));const rot=new THREE.Matrix4().makeRotationZ(-heading*Math.PI/180);threeCar.matrixAutoUpdate=false;threeCar.matrix.copy(tr.multiply(rot));this.camera.projectionMatrix=new THREE.Matrix4().fromArray(matrix);this.renderer.resetState();this.renderer.render(this.scene,this.camera);map.triggerRepaint()}};map.addLayer(custom)}else{document.querySelector('.car').style.display='block'}}catch(err){console.warn('3D vehicle unavailable:',err);document.querySelector('.car').style.display='block'}});
const keys={w:'ArrowUp',s:'ArrowDown',a:'ArrowLeft',d:'ArrowRight'};document.addEventListener('keydown',e=>{const k=keys[e.key.toLowerCase()]||e.key;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(k)){e.preventDefault();pressed.add(k)}});document.addEventListener('keyup',e=>pressed.delete(keys[e.key.toLowerCase()]||e.key));window.addEventListener('blur',()=>pressed.clear());document.querySelectorAll('[data-key]').forEach(b=>{const key=b.dataset.key;const down=e=>{e.preventDefault();pressed.add(key);b.classList.add('held');try{b.setPointerCapture(e.pointerId)}catch(_){}};const up=e=>{e.preventDefault();pressed.delete(key);b.classList.remove('held')};b.addEventListener('pointerdown',down);b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('lostpointercapture',up)});
document.getElementById('reset').onclick=()=>{lng=start[0];lat=start[1];heading=0;speed=0;idx=0;destination()};document.getElementById('camera').onclick=()=>cam=(cam+1)%3;document.getElementById('mapbtn').onclick=()=>{cam=cam===2?0:2};
function loop(now){const dt=Math.min((now-last)/1000,.05);last=now;if(playing){let throttle=pressed.has('ArrowUp')?1:0,reverse=pressed.has('ArrowDown')?1:0;if(throttle)speed+=19*dt;if(reverse)speed-=27*dt;if(!throttle&&!reverse)speed*=Math.pow(.94,dt*60);if(pressed.has(' '))speed*=Math.pow(.78,dt*60);speed=Math.max(-24,Math.min(95,speed));if(Math.abs(speed)<.3)speed=0;let steer=(pressed.has('ArrowRight')?1:0)-(pressed.has('ArrowLeft')?1:0);heading+=steer*Math.min(75,30+Math.abs(speed)*.55)*dt*Math.sign(speed||1);const radians=heading*Math.PI/180,metersPerSec=speed/3.6;lat+=Math.cos(radians)*metersPerSec*dt/111320;lng+=Math.sin(radians)*metersPerSec*dt/(111320*Math.cos(lat*Math.PI/180));map.jumpTo({center:[lng,lat],bearing:cam===2?0:heading,pitch:cam===2?0:cam===1?48:70,zoom:cam===2?14.7:cam===1?17.7:17});document.getElementById('speed').textContent=Math.abs(Math.round(speed));if(threeCar){document.querySelector('.car').style.display='none';for(const w of carWheels)w.rotation.x+=speed*dt*.08}const dist=meters([lng,lat],checkpoints[idx].pos);document.getElementById('distance').textContent=Math.round(dist)+' m to checkpoint';if(dist<35){discovered.add(checkpoints[idx].name);localStorage.setItem('mumbai-discoveries',JSON.stringify([...discovered]));idx=(idx+1)%checkpoints.length;destination();const n=document.getElementById('notice');n.textContent='✓ Checkpoint reached! Next destination unlocked';n.classList.add('show');setTimeout(()=>n.classList.remove('show'),2200)}}requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script><div id="explore" style="position:absolute;right:14px;bottom:105px;background:#071827d9;border:1px solid #ffffff44;border-radius:12px;padding:10px 13px;font:12px system-ui;max-width:180px">🏙️ Explore Mumbai<br><span style="color:#9dc9d0">Find famous landmarks and unlock new destinations.</span></div><style>.maplibregl-control-container{display:none}body:after{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,#00132065 100%)}.car{display:none}</style></body></html>
